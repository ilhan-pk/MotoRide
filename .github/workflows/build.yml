name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKM=$SDKM"
          ls "$SDK_ROOT" || true
          (yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null) || true
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: motoride-debug-apk
          path: app/build/outputs/apk/debug/*.apk
